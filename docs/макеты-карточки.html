<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макеты карточки заполнения</title>
<style>
  :root {
    --ink: #1c1915;
    --muted: #6b645c;
    --line: #e4ddd4;
    --paper: #f6f3ee;
    --white: #fff;
    --accent: #8a4b08;
    --ok: #1f6b45;
    --req: #9a3412;
    --side: 280px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.45 "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    display: grid;
    grid-template-columns: var(--side) 1fr;
    min-width: 1180px;
  }
  aside {
    background: #221e1a;
    color: #f3ece4;
    padding: 22px 16px 32px;
    overflow: auto;
  }
  aside h1 { font-size: 18px; margin: 0 0 6px; font-weight: 650; }
  aside p { margin: 0 0 16px; color: #cbbfb2; font-size: 13px; }
  aside button {
    display: block; width: 100%; text-align: left;
    background: transparent; color: inherit; border: 0;
    border-radius: 8px; padding: 8px 10px; margin: 0 0 4px;
    cursor: pointer; font: inherit;
  }
  aside button small { display: block; color: #b3a79c; font-size: 12px; }
  aside button.active { background: #3a322b; }
  main { overflow: auto; padding: 28px 36px 64px; }
  .stage-note { color: var(--muted); margin: 0 0 18px; max-width: 760px; }
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
  }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
  label.f input, label.f select, label.f textarea {
    font: inherit; color: var(--ink); background: #fff;
    border: 1px solid #d9d1c7; border-radius: 6px; padding: 8px 10px; width: 100%;
  }
  label.f[data-key="amount"] input { width: 26ch; max-width: 26ch; }
  .paper .row.equal label.f[data-key="amount"] { flex: 0 0 26ch; width: 26ch; min-width: 26ch; max-width: 26ch; }
  label.f textarea { min-height: 120px; resize: vertical; }
  label.f .req { color: var(--req); }
  label.f input[type="checkbox"] { width: auto; align-self: flex-start; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  button.btn, .actions button {
    font: inherit; border-radius: 8px; padding: 8px 14px; cursor: pointer;
    border: 1px solid #d9d1c7; background: #fff; color: var(--ink);
  }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .switch { display: flex; gap: 6px; margin-bottom: 14px; }
  .switch button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* 1 paper with sections */
  .paper { background: #fffef9; border: 1px solid #ddd4c4; box-shadow: 0 1px 0 #fff inset; max-width: 820px; }
  .paper .sheet { border-left: 3px solid #c4554a; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .paper h2 { font-family: Georgia, serif; font-weight: 500; margin: 0 0 8px; }
  .paper .lead { margin: 0 0 4px; }
  .paper .lead input { font-size: 18px; padding: 10px 12px; }
  .paper section { border-top: 1px solid #e6dcc8; padding-top: 12px; margin-top: 8px; }
  .paper h3 { font-family: Georgia, serif; font-weight: 500; margin: 0 0 8px; font-size: 18px; }
  .paper .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .paper .row.equal { display: flex; flex-wrap: wrap; gap: 12px; }
  .paper .row.equal label.f { flex: 1 1 150px; min-width: 150px; width: auto; }
  .paper .row.equal label.f[data-key="addressee"],
  .paper .row.equal label.f[data-key="counterparty"] { flex: 2 1 320px; min-width: 320px; }
  .paper .row label.f[data-key="body"],
  .paper .row label.f[data-key="file"],
  .paper .row label.f[data-key="link"] { grid-column: 1 / -1; }
  .paper .row.equal label.f { grid-column: auto; }

  /* letter */
  .letter h2 { font-size: 28px; font-weight: 600; margin: 0 0 12px; }
  .letter .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .letter .chips label.f { width: 180px; }
  .letter .chips label.grow { flex: 1; min-width: 280px; }

  /* steps */
  .steps { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 16px; }
  .steps article { background: #faf8f5; border-radius: 10px; padding: 14px; }
  .steps h3 { margin: 0 0 10px; font-size: 14px; }
  .steps .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; margin-right: 6px; }

  /* command */
  .command .title input { font-size: 22px; padding: 12px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
  .command .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .command .toolbar label.f { width: 200px; }

</style>
</head>
<body>
<aside>
  <h1>Карточка заполнения</h1>
  <p>Четыре раскладки одной и той же карточки. Вид переключается на самой карточке. Показаны только его поля.</p>
  <div id="nav"></div>
</aside>
<main>
  <p class="stage-note" id="note"></p>
  <div id="stage"></div>
</main>
<script>
const types = ["договор", "входящий", "заявка"];
const typeTitle = { договор: "Договор", входящий: "Входящий документ", заявка: "Заявка в службу" };

const catalog = {
  subtype: { label: "Подвид", control: "select", options: ["— без подвида —", "Поставка", "Услуги"], group: "doc" },
  domain: { label: "Контур", control: "select", options: ["Общий", "Закупки", "Продажи", "Производство"], group: "doc" },
  importance: { label: "Важность", control: "select", options: ["Обычная", "Повышенная", "Немедленная"], group: "doc" },
  title: { label: "Заголовок", control: "text", required: true, group: "title" },
  link: { label: "Связать с документом", control: "text", placeholder: "Не обязательно", group: "doc" },
  counterparty: { label: "Контрагент", control: "text", required: true, group: "party" },
  inn: { label: "ИНН", control: "text", placeholder: "10 или 12 цифр", group: "party" },
  customer: { label: "Договор с заказчиком", control: "check", group: "party" },
  amount: { label: "Сумма", control: "text", placeholder: "0,00", group: "party" },
  department: { label: "Отдел", control: "select", options: ["— отдел —", "Отдел закупок", "Канцелярия", "Коммерческая служба"], group: "who" },
  addressee: { label: "Адресат", control: "text", group: "who" },
  service: { label: "Служба", control: "select", options: ["ИТ-поддержка", "АХО и эксплуатация", "Служба персонала", "Отдел закупок"], required: true, group: "who" },
  body: { label: "Содержание", control: "textarea", group: "text" },
  file: { label: "Файл", control: "file", group: "file" }
};

const byType = {
  договор: ["subtype", "domain", "importance", "title", "link", "counterparty", "inn", "customer", "amount", "body", "file"],
  входящий: ["subtype", "domain", "importance", "title", "link", "counterparty", "inn", "department", "addressee", "body", "file"],
  заявка: ["subtype", "domain", "importance", "title", "link", "service", "department", "addressee", "body", "file"]
};
byType.входящийAddresseeRequired = true;
catalog.addressee.requiredFor = ["входящий"];
catalog.body.requiredFor = ["договор", "заявка"];

const samples = {
  договор: { title: "Поставка датчиков давления", counterparty: "ООО «Северсталь»", inn: "3528000594", amount: "1250000", body: "Поставить 40 датчиков до 15 декабря. Оплата по факту приёмки." },
  входящий: { title: "О направлении проекта договора", counterparty: "АО «Транснефть»", inn: "7706061801", addressee: "Торотадзе Дмитрий Шотаевич", body: "Просим рассмотреть проект и направить замечания." },
  заявка: { title: "Доступ к испытательному стенду", service: "ИТ-поддержка", department: "Отдел закупок", body: "Нужен доступ для приёмки партии на следующей неделе." }
};

let currentType = "договор";
let currentLayout = "paper";

function isRequired(key) {
  const spec = catalog[key];
  if (spec.requiredFor) return spec.requiredFor.includes(currentType);
  return !!spec.required;
}

function control(key) {
  const spec = catalog[key];
  const label = document.createElement("label");
  label.className = "f";
  label.dataset.group = spec.group;
  label.dataset.key = key;
  const name = document.createElement("span");
  name.textContent = spec.label;
  if (isRequired(key)) {
    const star = document.createElement("span");
    star.className = "req";
    star.textContent = " *";
    name.append(star);
  }
  let input;
  if (spec.control === "select") {
    input = document.createElement("select");
    for (const option of spec.options) input.append(new Option(option, option));
  } else if (spec.control === "textarea") {
    input = document.createElement("textarea");
  } else if (spec.control === "check") {
    input = document.createElement("input");
    input.type = "checkbox";
  } else if (spec.control === "file") {
    input = document.createElement("input");
    input.type = "file";
  } else {
    input = document.createElement("input");
    input.type = "text";
    if (spec.placeholder) input.placeholder = spec.placeholder;
  }
  const sample = samples[currentType][key];
  if (sample && input.tagName !== "SELECT" && input.type !== "checkbox") input.value = sample;
  label.append(name, input);
  return label;
}

function keys() { return byType[currentType]; }
function pick(...groups) {
  return keys().filter((key) => groups.includes(catalog[key].group)).map(control);
}
function one(key) { return keys().includes(key) ? control(key) : null; }
function mount(parent, nodes) {
  for (const node of nodes) if (node) parent.append(node);
}

function switcher() {
  const bar = document.createElement("div");
  bar.className = "switch";
  for (const type of types) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "btn";
    button.textContent = typeTitle[type];
    button.setAttribute("aria-pressed", String(type === currentType));
    button.addEventListener("click", () => { currentType = type; draw(); });
    bar.append(button);
  }
  return bar;
}

function actions() {
  const row = document.createElement("div");
  row.className = "actions";
  const start = document.createElement("button");
  start.type = "button";
  start.textContent = "Создать и запустить";
  const draft = document.createElement("button");
  draft.type = "button";
  draft.className = "primary";
  draft.textContent = "Создать черновик";
  row.append(start, draft);
  return row;
}

function renderPaper(host) {
  const card = el("div", "card paper");
  card.append(switcher());
  const sheet = el("div", "sheet");
  const title = el("h2");
  title.textContent = typeTitle[currentType];
  sheet.append(title);
  const lead = one("title");
  if (lead) {
    lead.classList.add("lead");
    sheet.append(lead);
  }
  const blocks = [
    ["Документ", ["doc"]],
    ["Участники", ["who", "party"]],
    ["Текст", ["text", "file"]]
  ];
  for (const [name, groups] of blocks) {
    const nodes = groups.flatMap((group) => pick(group));
    if (!nodes.filter(Boolean).length) continue;
    const section = document.createElement("section");
    section.append(heading(name));
    const row = el("div", "row" + (name === "Участники" ? " equal" : ""));
    mount(row, nodes);
    section.append(row);
    sheet.append(section);
  }
  sheet.append(actions());
  card.append(sheet);
  host.append(card);
}

function renderLetter(host) {
  const card = el("div", "card letter");
  card.append(switcher());
  const h = el("h2");
  h.textContent = typeTitle[currentType];
  card.append(h);
  const chips = el("div", "chips");
  const title = one("title");
  if (title) title.classList.add("grow");
  mount(chips, [title, ...pick("doc"), ...pick("party"), ...pick("who")]);
  card.append(chips);
  mount(card, [one("body"), one("file"), actions()]);
  host.append(card);
}

function renderSteps(host) {
  const card = el("div", "card");
  card.append(switcher());
  const grid = el("div", "steps");
  const columns = [
    ["1", "Реквизиты", ["title", "doc"]],
    ["2", "Участники", ["who", "party"]],
    ["3", "Текст", ["text", "file"]]
  ];
  for (const [n, name, groups] of columns) {
    const article = document.createElement("article");
    const h = el("h3");
    const badge = el("span", "n");
    badge.textContent = n;
    h.append(badge, document.createTextNode(name));
    article.append(h);
    mount(article, groups.flatMap((group) => group === "title" ? [one("title")] : pick(group)));
    grid.append(article);
  }
  card.append(grid, actions());
  host.append(card);
}

function renderCommand(host) {
  const card = el("div", "card command");
  card.append(switcher());
  const title = one("title");
  if (title) title.classList.add("title");
  const bar = el("div", "toolbar");
  mount(bar, [...pick("doc"), ...pick("party"), ...pick("who")]);
  card.append(title, bar);
  mount(card, [one("body"), one("file"), actions()]);
  host.append(card);
}

function el(tag, className) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  return node;
}
function heading(text) {
  const h = el("h3");
  h.textContent = text;
  return h;
}

const layouts = [
  ["paper", "Бумажный бланк секциями", "Лист с красным полем. Внутри секции друг под другом: документ, участники, текст.", renderPaper],
  ["letter", "Как письмо", "Крупный заголовок вида, остальные поля — короткими плашками в одну ленту.", renderLetter],
  ["steps", "Три шага рядом", "Реквизиты, участники и текст видны сразу, но разложены по порядку заполнения.", renderSteps],
  ["command", "Заголовок крупно, остальное панелью", "Сначала название, затем короткая панель реквизитов и текст.", renderCommand]
];

function drawNav() {
  const nav = document.querySelector("#nav");
  nav.replaceChildren();
  for (const [id, title, note] of layouts) {
    const button = document.createElement("button");
    button.type = "button";
    if (id === currentLayout) button.className = "active";
    const name = document.createElement("span");
    name.textContent = title;
    const small = document.createElement("small");
    small.textContent = note;
    button.append(name, small);
    button.addEventListener("click", () => { currentLayout = id; draw(); });
    nav.append(button);
  }
}

function draw() {
  drawNav();
  const layout = layouts.find((item) => item[0] === currentLayout);
  document.querySelector("#note").textContent = layout[2];
  const stage = document.querySelector("#stage");
  stage.replaceChildren();
  layout[3](stage);
}

draw();
</script>
</body>
</html>
