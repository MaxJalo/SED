server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/ok6-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/ok6-server.key;

    # Support streaming uploads up to 50 MB without full-body buffering
    client_max_body_size 50m;
    proxy_request_buffering off;
    proxy_buffering off;

    location /v1/ {
        proxy_pass http://api:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass http://api:8080/healthz;
    }

    location /api/v1/auth/ {
        proxy_pass http://temp-auth:8091/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /dev/ {
        proxy_pass http://temp-auth:8091/dev/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
