services:
  temp-auth:
    build:
      context: ./temp-auth
    restart: unless-stopped
    environment:
      TEMP_AUTH_PORT: ${TEMP_AUTH_PORT:-8091}
      TEMP_AUTH_SIGNING_KEY: ${TEMP_AUTH_SIGNING_KEY:-dev_ephemeral_jwt_signing_key_change_in_prod}
      TEMP_AUTH_TOKEN_TTL_MIN: ${TEMP_AUTH_TOKEN_TTL_MIN:-60}
      ODATA_BASE_URL: ${ODATA_BASE_URL:-}
      ODATA_USERNAME: ${ODATA_USERNAME:-}
      ODATA_PASSWORD: ${ODATA_PASSWORD:-}
      ODATA_ORG_MATCH: ${ODATA_ORG_MATCH:-}
      ODATA_TIMEOUT_SEC: ${ODATA_TIMEOUT_SEC:-60}
      DEMO_ADMIN_LOGIN: ${DEMO_ADMIN_LOGIN:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_MANAGER_LOGIN: ${DEMO_MANAGER_LOGIN:-}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:-}
    ports:
      - "${TEMP_AUTH_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    depends_on:
      temp-auth:
        condition: service_healthy
    environment:
      AUTH_BASE_URL: http://temp-auth:8091
