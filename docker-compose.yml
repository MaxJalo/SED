name: sed

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sed_db}
      POSTGRES_USER: ${POSTGRES_USER:-sed_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sed_dev_change_me_local_only}
    volumes:
      - sed_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sed_user} -d ${POSTGRES_DB:-sed_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://sed_user:sed_dev_change_me_local_only@postgres:5432/sed_db?sslmode=disable}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://orchestrator:8000}
      ORCH_BASE_URL: ${ORCH_BASE_URL:-http://orchestrator:8000}
      FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT:-/var/lib/sed/files}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-52428800}
      URGENT_THRESHOLD_HOURS: ${URGENT_THRESHOLD_HOURS:-16}
    volumes:
      - sed_files_vol:/var/lib/sed/files
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./services/worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://sed_user:sed_dev_change_me_local_only@postgres:5432/sed_db?sslmode=disable}
      ORCH_BASE_URL: ${ORCH_BASE_URL:-http://orchestrator:8000}
      ONEC_BASE_URL: ${ONEC_BASE_URL:-http://onec-gateway:8080}
      URGENT_THRESHOLD_HOURS: ${URGENT_THRESHOLD_HOURS:-16}

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PROXY_PORT:-8000}:80"
    volumes:
      - ./deploy/reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sed_pg_data:
  sed_files_vol:
