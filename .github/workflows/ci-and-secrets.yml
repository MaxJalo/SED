name: CI and Secret Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret & Leak Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run custom secret and leak guard
        run: go run ./scripts/secret_guard.go --all

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compliance-audit:
    name: TZ Compliance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Verify architecture & TZ invariants
        run: go run ./.cursor/skills/sed-tz-compliance/scripts/verify_compliance.go

  temp-auth-tests:
    name: Isolated temp-auth Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run temp-auth tests
        working-directory: ./temp-auth
        run: go test -v -race ./...

  docker-compose-validate:
    name: Validate Docker Compose Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate main compose
        run: docker compose -f docker-compose.yml config -q
      - name: Validate dev-auth override
        run: docker compose -f docker-compose.yml -f docker-compose.dev-auth.yml config -q
      - name: Validate full dev stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev-auth.yml -f docker-compose.dev-mocks.yml config -q
